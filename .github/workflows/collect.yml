name: collect-indicators
on:
  schedule:
    - cron: "17 2 * * *"     # يومياً 05:17 بتوقيت الرياض
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py --runner cloud
      - run: python build.py
      - name: commit if changed
        run: |
          git config user.name "indicators-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "تحديث آلي $(date -u +%F)"
          git push
